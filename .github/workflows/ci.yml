name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 本包零依赖、零构建脚本，所以没有 install 步骤：
# 测试是手写的 check() 断言，直接 node 跑。
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 环境自检
        run: |
          node --version
          npm --version

      - name: 语法检查（所有源码与测试）
        run: |
          for f in lib/*.js lib/handlers/*.js client/client.js test/*.mjs; do
            node --check "$f"
          done

      - name: host 半边测试（120 项断言）
        run: node test/host-assembly.mjs

      - name: client 半边测试（57 项断言）
        run: node test/client-runtime.mjs

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 本包零依赖、零构建脚本，所以没有 install 步骤：
# 测试是手写的 check() 断言，直接 node 跑。
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 环境自检
        run: |
          node --version
          npm --version

      - name: 语法检查（所有源码与测试）
        run: |
          for f in lib/*.js lib/handlers/*.js client/client.js test/*.mjs scripts/*.mjs; do
            node --check "$f"
          done

      - name: host 半边测试（注册表 / 工具 / 路由 / 提示注入）
        run: node test/host-assembly.mjs

      - name: client 半边测试（总览 / 资源层 / 钥匙三层）
        run: node test/client-runtime.mjs

      - name: 导出 / 导入 / 清空
        run: node test/portability.mjs

      # B、C 两类 handler：SigV4 用 AWS 官方测试向量核对，SQLite 用真库，
      # 对象存储打本机 mock 服务器。Node 22.5–23.3 的 node:sqlite 需要
      # --experimental-sqlite，测试里会检测并跳过真库断言（其余断言照跑）。
      - name: B / C 类 handler 测试（sqlite / SigV4 / S3 / WebDAV）
        run: node test/handlers-bc.mjs

      # 防止把"运行时数据"提交上来：库清单、钥匙、台账、语料、本机路径。
      # 只读文件、不联网、不改任何东西；命中即失败。
      - name: 上传前自检（仓库里不该有你的库与钥匙）
        run: node scripts/preflight-upload.mjs
